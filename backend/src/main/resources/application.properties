# ADR-DETECT Spring Boot Configuration
spring.application.name=adr-detect-backend
server.port=${PORT:8085}

# Database: H2 is the safe local default; MySQL can be supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:mem:adrdetectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# SQL seed data (synthetic educational data only)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# H2 Console is disabled by default. Enable only for local development when needed.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Logging
logging.level.com.adrdetect=INFO
